services:
  youtube-learning-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: youtube-learning-agent:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - yt_agent_chroma:/app/data/chroma
    restart: unless-stopped

volumes:
  yt_agent_chroma: